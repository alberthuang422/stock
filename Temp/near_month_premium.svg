<text x="40" y="509" fill="#e6e9ec" font-size="12.5" font-weight="700">你说得对：「前端更陡」是常态 —— 但它这次真的被打破了</text>
<text x="40" y="528" fill="#56B4E9" font-size="10.5" font-weight="700">常态</text>
<text x="104" y="528" fill="#9aa0a6" font-size="10.3">128 日中 92 日（71.9%）OCT-NOV 更陡；均值 1.731 vs 1.491（比值 0.86）。</text>
<text x="40" y="543" fill="#9aa0a6" font-size="10.5" font-weight="700">常态成因</text>
<text x="104" y="543" fill="#9aa0a6" font-size="10.3">近月合约最贴近现货，交割/移仓与现货紧张集中在前端 → M1-M2 天然占优。</text>
<text x="40" y="558" fill="#D55E00" font-size="10.5" font-weight="700">这次例外</text>
<text x="104" y="558" fill="#9aa0a6" font-size="10.3">8/5 起比值首次「连续 5 日站稳 1.0」；8/5–9/10 有 96.2% 的交易日 NOV-DEC 反而更陡。</text>
<text x="40" y="573" fill="#009E73" font-size="10.5" font-weight="700">怎么判读</text>
<text x="104" y="573" fill="#9aa0a6" font-size="10.3">不是 NOV 单腿变强（9/3→9/10 三腿涨幅几乎相同：OCT/NOV +5.99%、DEC +5.50%），</text>
<text x="104" y="588" fill="#9aa0a6" font-size="10.3">而是定价重心从 M1-M2 搬到 M2-M3 = 挤压点后移的结构信号。</text>
<text x="24" y="620" fill="#6b7076" font-size="9.5">数据：data/cl_contracts/daily/US.CL2610|2611|2612.csv（2026-03-10 起 128 交易日）</text>
