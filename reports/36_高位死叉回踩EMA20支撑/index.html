<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>蓝筹周线：0轴上方高位刚死叉 × 回踩EMA20支撑 · 事件研究</title>
  <script>
    // Set theme before CSS parses to avoid FOUC
    document.documentElement.setAttribute(
      'data-theme',
      (function () { try { return localStorage.getItem('bt-theme') || 'light'; } catch (e) { return 'light'; } })()
    );
  </script>
  <style>
    /* ---------------- design tokens ---------------- */
    :root[data-theme="dark"] {
      --bg: #0d1117;
      --bg-elev: #131722;
      --surface: #161b22;
      --surface-2: #1c2030;
      --hover: #1f2433;
      --border: #1f2230;
      --border-strong: #2a2e3e;
      --text: #d1d4dc;
      --text-strong: #f0f3fa;
      --muted: #787b86;
      --muted-2: #50535e;
      --accent: #2962ff;
      --accent-glow: rgba(41, 98, 255, 0.18);
      --gain: #26a69a;
      --gain-strong: #2dd4bf;
      --gain-glow: rgba(38, 166, 154, 0.18);
      --loss: #ef5350;
      --loss-strong: #f87171;
      --loss-glow: rgba(239, 83, 80, 0.18);
      --warn: #ff9800;
      --neutral: #b2b5be;
      --grid: rgba(255, 255, 255, 0.04);
      --grid-strong: rgba(255, 255, 255, 0.10);
      --crosshair: rgba(160, 167, 184, 0.50);
      --shadow-soft: 0 1px 0 rgba(255,255,255,0.04) inset, 0 8px 24px rgba(0,0,0,0.32);
    }

    :root[data-theme="light"] {
      --bg: #ffffff;
      --bg-elev: #f8f9fc;
      --surface: #ffffff;
      --surface-2: #f3f5f9;
      --hover: #eef1f8;
      --border: #e6e8ee;
      --border-strong: #d6dae3;
      --text: #131722;
      --text-strong: #0a0d14;
      --muted: #6a6d78;
      --muted-2: #8c8f99;
      --accent: #2962ff;
      --accent-glow: rgba(41, 98, 255, 0.12);
      --gain: #089981;
      --gain-strong: #00a884;
      --gain-glow: rgba(8, 153, 129, 0.12);
      --loss: #f23645;
      --loss-strong: #ef4444;
      --loss-glow: rgba(242, 54, 69, 0.12);
      --warn: #ff9800;
      --neutral: #4a4d57;
      --grid: rgba(0, 0, 0, 0.04);
      --grid-strong: rgba(0, 0, 0, 0.08);
      --crosshair: rgba(60, 65, 80, 0.45);
      --shadow-soft: 0 1px 0 rgba(0,0,0,0.02) inset, 0 6px 24px rgba(19,23,34,0.06);
    }

    /* Eastern color convention (A-share / HK): 涨红跌绿 — swap gain/loss palette */
    :root[data-theme="dark"][data-color-scheme="eastern"] {
      --gain: #ef5350;
      --gain-strong: #f87171;
      --gain-glow: rgba(239, 83, 80, 0.18);
      --loss: #26a69a;
      --loss-strong: #2dd4bf;
      --loss-glow: rgba(38, 166, 154, 0.18);
    }
    :root[data-theme="light"][data-color-scheme="eastern"] {
      --gain: #f23645;
      --gain-strong: #ef4444;
      --gain-glow: rgba(242, 54, 69, 0.12);
      --loss: #089981;
      --loss-strong: #00a884;
      --loss-glow: rgba(8, 153, 129, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Noto Sans SC', sans-serif;
      font-feature-settings: 'tnum' 1, 'cv11' 1, 'ss01' 1;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      font-size: 14px;
      letter-spacing: -0.01em;
    }

    .app { min-height: 100vh; display: flex; flex-direction: column; }

    /* ---------------- topbar ---------------- */
    .topbar {
      height: 50px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      gap: 16px;
      background: color-mix(in srgb, var(--bg) 85%, transparent);
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .tb-left, .tb-right { display: flex; align-items: center; gap: 12px; }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.01em;
      color: var(--text-strong);
    }
    .brand-logo {
      width: 24px; height: 24px;
      border-radius: 7px;
      background: linear-gradient(135deg, var(--accent) 0%, #6b8eff 100%);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 800;
      color: #fff;
      box-shadow: 0 4px 12px var(--accent-glow);
      letter-spacing: 0;
    }
    .brand-sep {
      width: 1px;
      height: 18px;
      background: var(--border);
      margin: 0 4px;
    }
    .brand-strategy {
      color: var(--muted);
      font-weight: 500;
      max-width: 280px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .menu-chip {
      padding: 6px 12px;
      border-radius: 8px;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text);
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
      cursor: default;
      user-select: none;
    }
    .menu-chip:hover { background: var(--hover); }
    .menu-chip.active {
      background: var(--surface-2);
      border-color: var(--border);
      font-weight: 600;
      color: var(--text-strong);
    }

    .dot { width: 6px; height: 6px; border-radius: 999px; background: var(--accent); display: inline-block; }
    .dot.green { background: var(--gain); box-shadow: 0 0 0 2px var(--gain-glow); }

    .icon-btn {
      width: 32px; height: 32px;
      border-radius: 8px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .icon-btn:hover {
      background: var(--hover);
      color: var(--text-strong);
      border-color: var(--border-strong);
    }

    /* ---------------- page ---------------- */
    .page {
      width: 100%;
      max-width: 1480px;
      margin: 0 auto;
      padding: 24px 28px 56px;
    }

    .report-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 24px;
      padding: 4px 0 24px;
      animation: fadeUp 0.55s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .report-title {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-strong);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .symbol-badge {
      display: inline-flex;
      align-items: center;
      padding: 5px 10px;
      border-radius: 6px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      font-family: 'JetBrains Mono', 'SF Mono', 'Menlo', monospace;
      letter-spacing: 0.02em;
    }

    .report-subtitle {
      color: var(--muted);
      font-size: 13px;
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .live-pulse {
      width: 7px; height: 7px;
      border-radius: 999px;
      background: var(--gain);
      animation: pulse 2.4s ease-out infinite;
      display: inline-block;
      flex-shrink: 0;
    }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(38, 166, 154, 0.55); }
      70%  { box-shadow: 0 0 0 8px rgba(38, 166, 154, 0); }
      100% { box-shadow: 0 0 0 0 rgba(38, 166, 154, 0); }
    }

    .date-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 9px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 13px;
      color: var(--text);
      font-feature-settings: 'tnum';
    }
    .date-badge .arrow { color: var(--muted); }

    /* ---------------- tabs ---------------- */
    .tabs {
      display: flex;
      align-items: center;
      gap: 4px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 22px;
      position: relative;
      flex-wrap: wrap;
    }
    .tab {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 13px 18px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      position: relative;
      transition: color 0.2s ease;
      font-family: inherit;
      letter-spacing: -0.005em;
    }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--text-strong); font-weight: 600; }
    .tab-indicator {
      position: absolute;
      bottom: -1px;
      left: 0;
      height: 2px;
      width: 0;
      background: var(--accent);
      border-radius: 2px 2px 0 0;
      transition: transform 0.4s cubic-bezier(0.5, 0, 0.2, 1), width 0.4s cubic-bezier(0.5, 0, 0.2, 1);
      pointer-events: none;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .tab-panels { display: block; }
    .tab-panel {
      display: none;
      animation: fadeUp 0.45s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    .tab-panel.active { display: block; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ---------------- modules ---------------- */
    .module-grid {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: 16px;
    }

    .module {
      grid-column: span 12;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow-soft);
      overflow: hidden;
      animation: fadeUp 0.55s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    .module.span-6 { grid-column: span 6; }
    .module.span-4 { grid-column: span 4; }
    .module.span-8 { grid-column: span 8; }

    .module-grid > .module:nth-child(1) { animation-delay: 0.05s; }
    .module-grid > .module:nth-child(2) { animation-delay: 0.12s; }
    .module-grid > .module:nth-child(3) { animation-delay: 0.18s; }
    .module-grid > .module:nth-child(4) { animation-delay: 0.24s; }
    .module-grid > .module:nth-child(5) { animation-delay: 0.30s; }

    .module-header {
      padding: 22px 24px 4px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }
    .module-header > div:first-child {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .module-title {
      font-size: 18px;
      font-weight: 600;
      margin: 0;
      color: var(--text-strong);
      letter-spacing: -0.01em;
      line-height: 1.25;
    }
    .module-subtitle {
      font-size: 13px;
      color: var(--muted);
      margin: 0;
      line-height: 1.4;
    }
    .module-body { padding: 18px 22px; }

    /* ---------------- KPI strip ---------------- */
    .kpi-strip {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 28px;
    }
    .kpi-item { min-width: 0; }
    .kpi-label {
      color: var(--muted);
      font-size: 11px;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 600;
    }
    .kpi-value {
      font-size: 22px;
      font-weight: 700;
      line-height: 1.2;
      color: var(--text-strong);
      font-feature-settings: 'tnum';
      letter-spacing: -0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .kpi-sub {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
      font-feature-settings: 'tnum';
    }

    .positive { color: var(--gain) !important; }
    .negative { color: var(--loss) !important; }

    /* ---------------- chart card ---------------- */
    .tv-chart-card { padding: 0; }
    .tv-chart-top {
      padding: 22px 24px 20px;
      display: flex;
      align-items: flex-start;
      gap: 24px;
      border-bottom: 1px solid var(--border);
    }
    .tv-chart-stats {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 28px;
      flex: 1;
    }

    .tv-chart-area { padding: 0; position: relative; }

    .chart-shell {
      width: 100%;
      height: 460px;
      position: relative;
      background: transparent;
    }
    .chart-shell svg {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
    }
    .chart-shell svg text { font-family: inherit; }

    .chart-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 14px 24px 16px;
      border-top: 1px solid var(--border);
    }
    .toggle-row {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
      font-size: 13px;
    }
    .toggle-item {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
      color: var(--text);
      padding: 6px 10px;
      border-radius: 6px;
      transition: background 0.15s, color 0.15s;
    }
    .toggle-item:hover { background: var(--hover); }
    .toggle-item.muted { color: var(--muted-2); }
    .toggle-item.muted .toggle-swatch { opacity: 0.35; }
    .toggle-swatch {
      width: 14px;
      height: 3px;
      border-radius: 2px;
      background: var(--gain);
      transition: opacity 0.15s;
    }
    /* Marker legend lives inside toggle-row, separated by a divider.
       Items are informational (not clickable) so they don't carry .toggle-item. */
    .legend-divider {
      width: 1px;
      height: 14px;
      background: var(--border);
      margin: 0 6px;
    }
    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 4px;
      color: var(--muted);
      font-size: 12px;
      user-select: none;
    }
    .legend-item svg { display: block; }

    .mode-switch {
      display: inline-flex;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 3px;
      gap: 2px;
    }
    .mode-chip {
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.18s ease;
      user-select: none;
    }
    .mode-chip:hover { color: var(--text); }
    .mode-chip.active {
      background: var(--bg);
      color: var(--text-strong);
      font-weight: 600;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.18);
    }

    /* ---------------- tooltip ---------------- */
    .tooltip {
      position: absolute;
      top: 18px;
      left: 18px;
      background: color-mix(in srgb, var(--surface-2) 92%, transparent);
      border: 1px solid var(--border-strong);
      border-radius: 9px;
      padding: 12px 14px;
      font-size: 12px;
      pointer-events: none;
      z-index: 5;
      min-width: 200px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      font-feature-settings: 'tnum';
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: opacity 0.12s ease;
    }
    .tooltip.hidden { opacity: 0; }
    .tooltip-date {
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 9px;
      font-weight: 600;
    }
    .tooltip-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      padding: 3px 0;
    }
    .tooltip-row .key {
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .tooltip-row .key::before {
      content: '';
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 2px;
      background: var(--swatch, var(--accent));
      flex-shrink: 0;
    }
    .tooltip-row .val {
      color: var(--text-strong);
      font-weight: 600;
    }

    /* ---------------- tables ---------------- */
    .metric-table {
      width: 100%;
      border-collapse: collapse;
      font-feature-settings: 'tnum';
    }
    .metric-table-wrap { overflow-x: auto; }
    .metric-table th, .metric-table td {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      text-align: right;
      vertical-align: middle;
    }
    .metric-table th:first-child, .metric-table td:first-child {
      text-align: left;
      width: 40%;
      color: var(--muted);
      font-size: 14px;
      font-weight: 500;
      white-space: normal;
    }
    .metric-table th:not(:first-child), .metric-table td:not(:first-child) { white-space: nowrap; }
    .metric-table td:not(:first-child) {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-strong);
      font-variant-numeric: tabular-nums;
    }
    .metric-table thead th {
      color: var(--muted);
      font-weight: 500;
      font-size: 12px;
      text-transform: none;
      letter-spacing: 0;
      background: transparent;
      border-bottom: 1px solid var(--border);
    }
    .metric-table tbody tr { transition: background 0.12s ease; }
    .metric-table tbody tr:hover { background: var(--hover); }
    .metric-table tbody tr:last-child td { border-bottom: 0; }
    .metric-main {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-strong);
    }
    .metric-secondary {
      color: var(--muted);
      font-size: 12px;
      margin-top: 3px;
      font-weight: 500;
    }

    .trades-table-wrap { overflow-x: auto; }
    .trades-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 720px;
      font-feature-settings: 'tnum';
    }
    .trades-table th, .trades-table td {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      white-space: nowrap;
    }
    .trades-table td {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-strong);
    }
    .trades-table td.num,
    .trades-table th.num {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .trades-table thead th {
      color: var(--muted);
      font-size: 12px;
      text-transform: none;
      letter-spacing: 0;
      background: transparent;
      position: sticky;
      top: 0;
      font-weight: 500;
      border-bottom: 1px solid var(--border);
    }
    .trades-table tbody tr { transition: background 0.12s ease; }
    .trades-table tbody tr:hover { background: var(--hover); }
    .trades-table tbody tr:last-child td { border-bottom: 0; }

    .pill {
      display: inline-flex;
      align-items: center;
      padding: 3px 9px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }

    .text-card {
      color: var(--text);
      line-height: 1.7;
      font-size: 14px;
    }
    .text-card > * + * { margin-top: 12px; }
    .text-card h1, .text-card h2, .text-card h3, .text-card h4, .text-card h5, .text-card h6 {
      color: var(--text-strong);
      line-height: 1.3;
      margin-top: 20px;
    }
    .text-card h1:first-child, .text-card h2:first-child, .text-card h3:first-child,
    .text-card h4:first-child, .text-card h5:first-child, .text-card h6:first-child {
      margin-top: 0;
    }
    .text-card p, .text-card ul, .text-card ol, .text-card blockquote, .text-card pre, .text-card table {
      margin: 0;
    }
    .text-card ul, .text-card ol {
      padding-left: 20px;
    }
    .text-card li + li {
      margin-top: 6px;
    }
    .text-card a {
      color: var(--accent);
      text-decoration: none;
    }
    .text-card a:hover {
      text-decoration: underline;
    }
    .text-card code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      padding: 2px 6px;
      border-radius: 6px;
      background: var(--surface-2);
      border: 1px solid var(--border);
    }
    .text-card pre {
      overflow-x: auto;
      padding: 12px 14px;
      border-radius: 10px;
      background: var(--surface-2);
      border: 1px solid var(--border);
    }
    .text-card pre code {
      padding: 0;
      border: 0;
      background: transparent;
    }
    .text-card blockquote {
      padding-left: 14px;
      border-left: 3px solid var(--accent);
      color: var(--muted);
    }
    .text-card table {
      width: 100%;
      border-collapse: collapse;
      font-feature-settings: 'tnum';
    }
    .text-card th, .text-card td {
      padding: 10px 12px;
      border: 1px solid var(--border);
      text-align: left;
      vertical-align: top;
    }
    .text-card thead th {
      background: var(--surface-2);
      color: var(--text-strong);
      font-size: 12px;

\u003e\u003ctd\u003e17\u003c/td\u003e\u003ctd\u003e+5.84%\u003c/td\u003e\u003ctd\u003e-0.00%\u003c/td\u003e\u003ctd\u003e58.8%\u003c/td\u003e\u003ctd\u003e58.8%\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e死叉+窗口外\u003c/td\u003e\u003ctd\u003e\u003e3%\u003c/td\u003e\u003ctd\u003e27\u003c/td\u003e\u003ctd\u003e+5.91%\u003c/td\u003e\u003ctd\u003e-0.55%\u003c/td\u003e\u003ctd\u003e74.1%\u003c/td\u003e\u003ctd\u003e60.7%\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\n\u003c/table\u003e\n"}, {"type": "text", "tab": "overview", "title": "一句话结论", "text": "**在你的信号定义下（0轴上方高位刚死叉 + 多头排列未破坏 + 跌破EMA10但收于EMA20上方1~3% + 距0轴上穿10~16周），支撑位的有效性没有被削弱，破位率也没有被抬升。**\n- A组（n=14，严格信号）T+20 平均 **+3.69%** / 中位 6.87% / 胜率 61.5%；对 SPY 超额 **-0.22pp**——与随机周买入基线（+5.79%/64.1%）基本打平，支撑没有失效。\n- **破位率 57.1% 反而是三组最低**（B 未死叉 72.7%、C 窗口外 63.9%）——「刚死叉」没有让 EMA20 更容易被打穿。\n- 但两个重要反转：①**10~16周「首次回调」窗口是表现最差的一档**（放宽后仅 +2.63%，而 16~24 周 +7.07%、24~40 周 +6.65%）；②窗口外死叉（C）胜率最高（74.3%）。逐层检验见敏感性模块。"}, {"type": "text", "tab": "overview", "title": "信号与分组口径（严格无前视）", "text": "- 频率：**周线级别**（周bar=每周最后交易日，复权OHLC，来自 data/\u003csym\u003e/\u003csym\u003e, W.csv）。\n- **MACD(12,26,9)**，DIF/DEA/Hist 均用「已完成周序列 + 当周 to-date close 递推」，不含未来信息。\n- 公共条件：DIF\u003e0 且 DEA\u003e0（0轴上方）；EMA10\u003eEMA20（多头排列未破坏）；close\u003cEMA10（已跌破10）；close/EMA20−1 ∈ [1%,3%]（勉强收于20上方）；DIF 较近26周峰值回落 ≥25%。\n- **死叉当周** = 本周 Hist\u003c0 且上周 Hist≥0（刚触发死叉）。\n- **窗口** = 距最近一次 DIF 上穿 0 轴 10~16 周（A/B 组）或窗口外（C 组，含更早/更晚）。\n- 破位率 = 事件后 T 周内周收盘最低 \u003c 事件周 EMA20×0.98；超额 = 个股 − SPY 同窗。"}, {"type": "text", "tab": "overview", "title": "关键敏感性结果（参数扫描）", "text": "- **DIF回落阈值**：≥0 或 ≥0.15 时「死叉+10~16周」样本从 37→37 例、fwd20 +2.63%/胜率62%；提到 ≥0.25 样本骤减到 14 例、fwd20 降至 +0.12%（≥0.35 仅 1 例）——**DIF回落≥25% 是主要样本杀手，且未带来收益提升**（敏感性模块柱图）。\n- **窗口分档**（死叉，无回落约束）：5-10w n=2；**10-16w n=37 fwd20 +2.63%**；16-24w n=75 **+7.07%/胜率77%**；24-40w n=103 **+6.65%/75%**——10~16 周是全部分档里最弱的一段。\n- **窗口内死叉 vs 未死叉**：死叉 n=37 +2.63% vs 未死叉 n=205 +4.11%——死叉在收益上略弱（约 −1.5pp），但**破位率反而更低**（A 57% vs B 73%）。"}, {"type": "text", "tab": "overview", "title": "破位后行为（A组内部）", "text": "- A 组 20 周内破位（n=7）fwd20 平均 **−9.95%**，未破位（n=6）**+19.59%**——分化极大，破位与否决定短期盈亏；\n- 但破位组 fwd60（约 60 周）平均仍能收回至 **+8.1%**、未破位 +32.7%——周线级别破位后「收回」概率仍不低（与报告31的深死叉逻辑一致）；\n- 提示：EMA20 上方 1~3% 缓冲意味着「破位」需要跌穿 2%~4% 才算，一旦触发往往是真的破位，止损纪律比胜率更重要。"}, {"type": "text", "tab": "overview", "title": "已知局限", "text": "- **样本量极小**：A 组仅 14 例、B 组 11 例，统计功效低，所有均值/t 值仅作方向参考；加严 DIF回落≥25% 后 A 组实际 T+20 有效样本 13 例。\n- **三组并非等概率抽样**：C（窗口外，n=72）天然包含更长的牛市段，样本构成不同。\n- 幸存者偏差：47 只仍存续蓝筹，不适用于退市/衰败股；事件历史最早至 1980 年，早年 SPY 超额有缺口（exc 部分为 NaN）。\n- 事件聚集：同周≥3股占 0% 事件，t 值视为上限。\n- 参数未寻优；周线「当周」值为 to-date 递推，与收盘后实际 MACD 略有差异。"}, {"type": "text", "tab": "overview", "title": "下一步建议", "text": "- 若把「首次回调」当入场理由，数据更支持 **16~40 周** 而非 10~16 周；10~16 周是动能最不稳定段。\n- 建议弱化 DIF 回落阈值（≥0.15 即可），以换取样本量；或改用「跌幅/回撤深度」等连续变量替代硬阈值。\n- 破位后 fwd60 收回率高，可专门验证「破位 EMA20 后周收盘收回」作为二次买点的收益/回撤（承接报告31 深死叉超跌反弹线索）。\n- 扩展标的池（SP500 全成分、含已退市）提升样本并控制幸存者偏差。"}, {"type": "trades_table", "tab": "events", "title": "事件明细（共 97 条：分组 / 距0轴上穿 / DIF回落 / T+20 / 超额 / 破位）", "subtitle": "event = 回踩EMA20周；T+20 为事件周后第 20 周个股收益，超额为相对 SPY 同窗", "rows": [{"label": "ko 2011-05-27 · 死叉·距0轴上穿43周·DIF回落39%", "symbol": "ko", "event_date": "2011-05-27", "entry_date": "2011-05-27", "pnl_pct": 3.454115302744309, "exc20": 10.715819499186209, "group": "C", "broken20": 0, "display_symbol": "ko"}, {"label": "ko 2026-04-17 · 死叉·距0轴上穿23周·DIF回落28%", "symbol": "ko", "event_date": "2026-04-17", "entry_date": "2026-04-17", "pnl_pct": null, "exc20": null, "group": "C", "broken20": 0, "display_symbol": "ko"}, {"label": "brk.b 2020-11-06 · 死叉·距0轴上穿11周·DIF回落31%", "symbol": "brk.b", "event_date": "2020-11-06", "entry_date": "2020-11-06", "pnl_pct": 22.94468829768908, "exc20": 9.005210095179006, "group": "A", "broken20": 0, "display_symbol": "brk.b"}, {"label": "jnj 1996-08-30 · 死叉·距0轴上穿999周·DIF回落47%", "symbol": "jnj", "event_date": "1996-08-30", "entry_date": "1996-08-30", "pnl_pct": 4.705715109532416, "exc20": -15.21934570381229, "group": "C"   <script>
  (function () {
    'use strict';

    const REPORT = JSON.parse(document.getElementById('report-data').textContent || '{}');
    const ROOT = document.documentElement;

    // Color scheme: can be overridden via report_data.ui.color_scheme
    // ("eastern" | "western"). If not provided, derive from meta.market;
    // when market is missing/unknown, default to eastern (涨红跌绿).
    (function () {
      var ui = REPORT.ui || {};
      var meta = REPORT.meta || {};
      var scheme = ui.color_scheme;
      if (!scheme) {
        var mk = String(meta.market || '').toLowerCase();
        if (mk === 'china_a' || mk === 'a股' || mk === 'cn' || mk === 'cn-stock' ||
            mk === 'hong_kong' || mk === 'hk' || mk === 'hk-stock') {
          scheme = 'eastern';
        } else if (mk === 'us_stock' || mk === 'us' || mk === 'usa' || mk === 'us-market' ||
                   mk === 'america' || mk === 'american') {
          scheme = 'western';
        } else {
          scheme = 'eastern';
        }
      }
      if (scheme === 'eastern') ROOT.setAttribute('data-color-scheme', 'eastern');
      else ROOT.setAttribute('data-color-scheme', 'western');
    })();

    // i18n bag from report_data.ui.i18n; fallbacks keep behavior backward-compatible
    // for older payloads (default is Chinese — the skill is Chinese-first).
    const I18N = (REPORT.ui && REPORT.ui.i18n) || {};
    function t(key, fallback) {
      return I18N[key] != null ? I18N[key] : fallback;
    }

    // ---------------- format helpers ----------------
    function parseNumeric(value) {
      if (value == null) return null;
      if (typeof value === 'number') return Number.isFinite(value) ? value : null;
      var text = String(value).trim();
      if (!text) return null;
      var negativeByParens = false;
      if (/^\(.*\)$/.test(text)) {
        negativeByParens = true;
        text = text.slice(1, -1).trim();
      }
      text = text
        .replace(/,/g, '')
        .replace(/%/g, '')
        .replace(/\s+/g, '')
        .replace(/\u2212/g, '-');
      if (!text) return null;
      var num = Number(text);
      if (!Number.isFinite(num)) return null;
      return negativeByParens ? -Math.abs(num) : num;
    }
    function nf(value, digits) {
      if (digits == null) digits = 2;
      var num = parseNumeric(value);
      if (num == null) return '--';
      return num.toLocaleString('en-US', {
        minimumFractionDigits: digits,
        maximumFractionDigits: digits,
      });
    }
    function pf(value, digits) {
      if (digits == null) digits = 2;
      var num = parseNumeric(value);
      if (num == null) return '--';
      return nf(num, digits) + '%';
    }
    function signed(value, digits, suffix) {
      if (digits == null) digits = 2;
      if (suffix == null) suffix = '';
      const num = parseNumeric(value);
      if (num == null) return '--';
      return (num > 0 ? '+' : '') + nf(num, digits) + suffix;
    }
    function signClass(value) {
      const num = parseNumeric(value);
      if (num == null) return '';
      return num >= 0 ? 'positive' : 'negative';
    }
    function escapeHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    function renderMarkdownFallback(s) {
      if (s == null) return '';
      var text = escapeHtml(String(s));
      text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      text = text.replace(/&lt;br\s*\/?&gt;/gi, '<br>');
      text = text.replace(/\n/g, '<br>');
      return text;
    }
    function renderMarkdown(s) {
      if (s == null) return '';
      var source = String(s);
      if (window.marked && typeof window.marked.parse === 'function') {
        try {
          var rendered = window.marked.parse(source, {
            gfm: true,
            breaks: true,
            headerIds: false,
            mangle: false,
          });
          if (window.DOMPurify && typeof window.DOMPurify.sanitize === 'function') {
            return window.DOMPurify.sanitize(rendered);
          }
          console.warn('DOMPurify unavailable, falling back to basic markdown renderer.');
        } catch (e) {
          console.warn('markdown render failed, falling back to basic renderer:', e);
        }
      }
      return renderMarkdownFallback(source);
    }
    function axisLabel(point) {
      const raw = point && (point.date != null ? point.date : (point.x != null ? point.x : point.label));
      if (!raw) return '';
      const text = String(raw);
      if (/^\d{4}-\d{2}-\d{2}$/.test(text)) return text.slice(5);
      if (/^\d{4}-\d{2}$/.test(text)) return text;
      return text;
    }
    function fullLabel(point) {
      const raw = point && (point.date != null ? point.date : (point.x != null ? point.x : point.label));
      return raw ? String(raw) : '';
    }

    // ---------------- topbar ----------------
    function renderTopbar(meta, ui) {
      const left = document.getElementById('topbar-left');
      const right = document.getElementById('topbar-right');
      const menu = (ui && ui.topbar_menu) || [];
      const windowStatus = ((ui && ui.window_status) || '').trim();

      // Brand badge removed — strategy name and symbol are already shown
      // prominently in the header section below the topbar.
      let leftHtml = menu.map(function (item) {
        return '<div class="menu-chip ' + (item.active ? 'active' : '') + '">' +

          (item.dot ? '<span class="dot ' + (item.dot === 'green' ? 'green' : '') + '"></span>' : '') +
